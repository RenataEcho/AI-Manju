function nvHandle(action,el){let pid=ui.projectId,d=nvInit(pid),doc=d.doc;const val=el.dataset.val;const saveAndRender=()=>{nvSave();render()};if(action==='nvBack'){nvCapture();gotoProject(pid,'novel');return}if(action==='nvDoc'){nvCapture();d.doc=val;if(val==='chapter:')d.doc='overview';if(val.startsWith('chapter:'))ui.chapterId=val.slice(8);saveAndRender();return}if(action==='nvMode'){nvCapture();d.mode=d.mode==='simple'?'pro':'simple';saveAndRender();return}if(action==='nvLeft'||action==='nvRight'||action==='nvFocus'){nvCapture();if(action==='nvLeft')d.left=!d.left;if(action==='nvRight')d.right=!d.right;if(action==='nvFocus')d.focus=!d.focus;saveAndRender();return}if(action==='nvSave'){nvCapture();showToast('小说内容已保存');return}if(action==='nvAddChapter'){nvCapture();let n=db.novels.find(x=>x.projectId===pid),chap=db.chapters.filter(c=>c.novelId===n.id),cid=id('c'),rid=id('rev');if(mutate(x=>{x.chapters.push({id:cid,novelId:n.id,title:'第'+(chap.length+1)+'章 · 未命名',order:chap.length+1,currentRevisionId:rid});x.chapterRevisions.push({id:rid,chapterId:cid,content:'',createdAt:now()})})){d.doc='chapter:'+cid;saveAndRender()}return}if(action==='nvSelectRef'){nvCapture();d.selectedRef=[el.dataset.id];saveAndRender();return}if(action==='nvAddRef'){nvCapture();let list=d[doc],title=prompt('请输入'+(doc==='world'?'世界观':'人物')+'名称');if(!title?.trim())return;let rid='ref_'+Date.now();list.push({id:rid,title:title.trim(),content:''});d.selectedRef=[rid];saveAndRender();return}if(action==='nvNewBranch'){nvCapture();let title=prompt('新分支名称（如：第一章续写 / 人物关系讨论）');if(!title?.trim())return;let b=nvBranch(d),bid='branch_'+Date.now();d.branches.push({id:bid,title:title.trim(),parentId:b.id,sourceDoc:d.doc,createdAt:new Date().toISOString(),messages:[],summary:'从「'+b.title+'」派生。独立对话，不继承完整历史。'});d.branchId=bid;d.candidate=null;saveAndRender();return}if(action==='nvSwitchBranch'){nvCapture();d.branchId=el.dataset.id;d.candidate=null;saveAndRender();return}if(action==='nvDeleteBranch'){if(!confirm('删除此分支及其对话记录？已应用的正文不会删除。'))return;d.branches=d.branches.filter(x=>x.id!==el.dataset.id);if(d.branchId===el.dataset.id)d.branchId='main';d.candidate=null;saveAndRender();return}if(action==='nvAiMode'){ui.nvAiMode=val;render();return}if(action==='nvContext'){alert(nvContext(d).join('\n\n'));return}if(action==='nvGenerate'){let promptBefore=document.getElementById('nvPrompt')?.value||d.prompt||'';nvCapture();let b=nvBranch(d),promptText=promptBefore.trim();d.prompt=promptText;let type=ui.nvAiMode||'continue';let samples={continue:'灰烬在风中缓缓旋转。陆沉伸出手，一枚碎裂的铜铃落入掌心，铃身刻着他早已遗忘的故乡名字。他第一次感到，十二座死域之外，也许还有一条回家的路。',rewrite:'灰白虚空中，灰烬如凝固的雪，悬而不落。陆沉独立于星墟之巅，十二座死域在脚下沉默延伸。',outline:'方案一：灰烬来客带来故乡坐标；方案二：陆沉发现十二死域是记忆封印；方案三：烬火映出一位失踪亲人的背影。',dialogue:'陆沉：“你说你见过我的故乡？”\n来客：“我见过的不是故乡，是它燃尽后的灰。”',check:'伏笔建议：第一章的铜铃来源尚未交代；陆沉失去记忆与十二死域的关系可以在第三章埋入回收线索。'};let text=samples[type]+'\n\n【创作要求】'+(promptText||'根据当前作品设定继续创作');b.messages.push({role:'user',content:promptText||'执行'+type},{role:'assistant',content:text});b.summary='最近任务：'+(promptText||type).slice(0,65)+'；已产生候选，等待人工确认。';d.candidate={branchId:d.branchId,type,text,doc:d.doc,applied:false};d.prompt='';saveAndRender();return}if(action==='nvReject'){d.candidate=null;saveAndRender();return}if(action==='nvApply'){let c=d.candidate;if(!c||c.branchId!==d.branchId)return;if(c.applied){showToast('候选已应用，请勿重复插入');return}if(c.doc!==d.doc){showToast('请切回生成候选时的文档后应用');return}nvCapture();let before='';if(doc.startsWith('chapter:'))before=nvGetChapter(doc.slice(8));else if(doc==='outline')before=d.outline;else if(doc==='overview')before=pby(pid).synopsis||'';else if(doc==='notes')before=d.note;else{showToast('请在章节、故事大纲或作品概览中应用候选');return}let newText=(before?before+'\n\n':'')+c.text;d.versions.push({id:'v_'+Date.now(),doc,content:before,createdAt:new Date().toISOString(),reason:'AI 应用前自动快照'});if(doc.startsWith('chapter:')){if(!nvSaveChapter(doc.slice(8),newText))return}else if(doc==='outline')d.outline=newText;else if(doc==='notes')d.note=newText;else mutate(x=>x.projects.find(y=>y.id===pid).synopsis=newText);c.applied=true;d.candidate=null;saveAndRender();showToast('候选已应用，应用前版本已保存');return}if(action==='nvSnapshot'){nvCapture();let content=doc.startsWith('chapter:')?nvGetChapter(doc.slice(8)):doc==='outline'?d.outline:doc==='overview'?pby(pid).synopsis:document.getElementById('nvText')?.value||'';d.versions.push({id:'v_'+Date.now(),doc,content,createdAt:new Date().toISOString(),reason:'手动保存'});nvSave();showToast('已保存章节版本快照');return}if(action==='nvHistory'){nvCapture();let items=d.versions.filter(v=>v.doc===doc).slice(-12).reverse();if(!items.length){showToast('当前文档暂无历史版本');return}let choices=items.map((v,i)=>i+1+'. '+v.createdAt.slice(0,19).replace('T',' ')+' · '+v.reason).join('\n');let selected=prompt('当前文档历史版本（输入序号恢复）\n'+choices);let ix=Number(selected)-1;if(!Number.isInteger(ix)||!items[ix])return;if(!confirm('恢复历史版本会替换当前内容，确认继续？'))return;let v=items[ix],current=doc.startsWith('chapter:')?nvGetChapter(doc.slice(8)):doc==='outline'?d.outline:pby(pid).synopsis;d.versions.push({id:'v_'+Date.now(),doc,content:current,createdAt:new Date().toISOString(),reason:'恢复前备份'});if(doc.startsWith('chapter:'))nvSaveChapter(doc.slice(8),v.content);else if(doc==='outline')d.outline=v.content;else if(doc==='overview')mutate(x=>x.projects.find(y=>y.id===pid).synopsis=v.content);saveAndRender();showToast('历史版本已恢复');return}if(action==='nvAdapt'){nvCapture();gotoProject(pid,'drama');showToast('已进入漫剧改编入口，原小说内容保持独立');return}}

function persistDirect(){if(!directDraft)return true;directDraft.updatedAt=now();try{if(window.__simulateSaveFailure)throw Error('模拟保存失败');localStorage.setItem(DRAFTKEY,JSON.stringify(directDraft));ui.saveStatus='已保存';return true}catch(e){ui.saveStatus='保存失败';showToast('创建草稿保存失败，请检查本地存储；内容暂保留在当前页面');return false}}

function scriptBlocks(text,method){let lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let heading=lines.find(x=>/^(?:S\d+|第.{1,8}场|(?:内景|外景))/i.test(x))||'S01｜外景·待命名场景·夜';let blocks=lines.filter(x=>x!==heading).slice(0,9).map(x=>{let type=/旁白/.test(x)?'narration':/内心|OS/.test(x)?'os':/^[\p{Script=Han}]{2,6}[:：]/u.test(x)?'dialogue':'action';return {type,text:x}});if(!blocks.length)blocks=[{type:'action',text:'待补充场景动作与人物描述'}];if(method==='novel'){blocks=[{type:'action',text:'【动作】'+(lines[0]||'镜头缓缓推进，人物出现在画面中').slice(0,110)},{type:'narration',text:'【旁白】'+(lines[1]||'故事由此展开').slice(0,80)}]}return {heading,blocks}}

function directWizardHTML(){let d=directDraft;if(!d)return '<h2>创建草稿不可用</h2>';let step=d.step,method=d.method,inp=d.inputs[method]||{},c=draftCandidate();let steps=`<div class="stage" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:5px">${DIRECT_STEPS.map((t,i)=>`<div class="stageitem ${step===i?'on':''}" style="padding:8px 3px;font-size:11px">${i+1} ${t}</div>`).join('')}</div>`;let body='';if(step===0)body=`<div class="field"><label>作品名称 *（1–60 字）</label><input id="directName" maxlength="60" value="${esc(d.projectForm.name)}" placeholder="例如：星墟之主"></div><div class="field"><label>题材</label><select id="directGenre">${['玄幻','奇幻','都市','悬疑','古风','科幻','其他'].map(t=>`<option ${t===d.projectForm.genre?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>封面符号（Mock）</label><input id="directCover" maxlength="3" value="${esc(d.projectForm.cover)}"></div><div class="field"><label>作品简介（选填）</label><textarea id="directSynopsis">${esc(d.projectForm.synopsis)}</textarea></div>`;
else if(step===1)body=`<p class="muted">选择一种准备方式，后续可返回切换。每种方式的输入单独保留。</p><div class="direct-methods">${[['novel','📖','小说转剧本','小说原文 → Mock AI 改编 → EP01 草稿'],['script','📄','导入已有剧本','原始剧本 → Mock 结构识别 → 校对'],['blank','✎','空白剧本','无需 AI，直接建立 EP01 / S01']].map(x=>`<button class="direct-method ${method===x[0]?'selected':''}" data-action="directMethod" data-method="${x[0]}"><span class="direct-symbol">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small><span class="direct-tick">${method===x[0]?'✓ 已选择':'选择 →'}</span></button>`).join('')}</div>`;
else if(step===2)body=method==='blank'?`<p class="hint">不调用 AI，创建后可在工作台继续编辑剧本。</p><div class="field"><label>剧集名称</label><input id="directEpisode" value="${esc(inp.episode)}"></div><div class="field"><label>初始场次标题</label><input id="directScene" value="${esc(inp.scene)}"></div>`:`<div class="warn">离线 Mock：上传只保存文件名并生成示例文本，不进行真实 TXT/DOCX 解析；AI 改编也为模拟结果。</div><div class="field"><label>选择 TXT / DOCX 文件（Mock）</label><input id="directFile" type="file" accept=".txt,.docx"><span class="hint">${inp.fileName?'已选择：'+esc(inp.fileName):'也可直接粘贴原始文本'}</span></div><div class="field"><label>${method==='novel'?'小说原文':'原始剧本'} *</label><textarea id="directText" rows="7" placeholder="${method==='novel'?'粘贴小说段落...':'例如：S01 | 外景 · 星墟 · 夜...'}">${esc(inp.text)}</textarea></div>${method==='novel'?`<div class="field"><label>改编策略</label><select id="directStrategy">${['忠于原著','紧凑节奏','自定义'].map(t=>`<option ${t===inp.strategy?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>自定义要求（选择自定义时必填）</label><textarea id="directCustom" rows="2" placeholder="如：加强人物冲突，减少旁白">${esc(inp.custom)}</textarea></div>`:''}<div class="row"><button data-action="directGenerate" class="primary">${method==='novel'?'Mock AI 生成 EP01':'Mock 识别剧本结构'}</button><span class="hint">${c?'已有候选，可进入校对或重新生成':'尚未生成候选'}</span></div>`;
else if(step===3){let text=inp.text||'';body=`<div class="row between"><b>${method==='novel'?'小说改编校对':'剧本结构校对'}</b><span class="tag">EP01 · ${c?.status==='confirmed'?'已确认':'待确认'} · Mock</span></div><div class="direct-compare" data-pane="source"><div class="direct-source"><div class="row between"><b>原始${method==='novel'?'小说':'剧本'}（只读）</b><span class="hint">来源素材</span></div><pre>${esc(text)}</pre></div><div class="direct-editor"><div class="row between"><b>结构化剧本（可编辑）</b><span class="hint">场次与内容</span></div><div class="field"><label>剧集标题</label><input id="directEpisodeTitle" value="${esc(c?.episodeTitle||'EP01')}"></div><div class="row between"><span class="hint">场次列表（可增删、拆分、合并）</span><button class="sm" data-action="directAddScene">＋ 新增场次</button></div>${(c?.scenes||[]).map((scene,i)=>`<div class="direct-scene"><div class="row between"><b>场次 ${i+1}</b><div class="row"><button class="sm" data-action="directSplitScene" data-index="${i}">拆分</button><button class="sm" data-action="directMergeScene" data-index="${i}" ${i===0?'disabled':''}>合并上场</button><button class="sm danger" data-action="directRemoveScene" data-index="${i}" ${(c?.scenes?.length||0)===1?'disabled':''}>删除</button></div></div><div class="field"><label>场次标题</label><input id="sceneHead${i}" value="${esc(scene.heading)}"></div><div class="field"><label>动作 / 对白 / 旁白 / OS（每行一个块）</label><textarea id="sceneText${i}" rows="5">${esc(scene.text)}</textarea></div></div>`).join('')}</div></div><div class="direct-mobile-switch"><button class="sm active" data-action="directPane" data-pane="source">原文</button><button class="sm" data-action="directPane" data-pane="editor">剧本</button></div><div class="row" style="margin-top:14px"><button data-action="directRegenerate">${method==='novel'?'重新生成候选':'重新识别'}</button><span class="hint">不会静默覆盖已校对内容</span></div>`}

return `<h2>直接制作漫剧 <span class="tag">V2.2 场景版</span></h2>${steps}${step===2?`<div class="scenario-preset"><b>业务场景样例</b><p class="hint">一键填入真实叙事 Mock 素材，便于逐步检查创建流程。</p><button data-action="directPreset">载入${method==='novel'?'星墟之主小说':method==='script'?'逆命者剧本':'霜城空白剧本'}示例</button></div>`:''}${body}<div class="modalfoot"><button data-action="directExit">保存草稿并退出</button>${step>0?'<button data-action="directBack">上一步</button>':''}${step!==2&&step<4?'<button class="primary" data-action="directNext">下一步 →</button>':''}${step===3?'<button class="primary" data-action="directNext">确认校对 →</button>':''}${step===4?'<button class="primary" data-action="directCommit">确认创建并进入工作台</button>':''}</div>`}
function handleDirect(action,el){let d=directDraft;if(action==='directExportDraft'){download('AI_Manju_Direct_Draft_Backup.json',localStorage.getItem(DRAFTKEY)||'{}');return}if(action==='directDiscard'){if(!confirm('放弃未完成的漫剧创建草稿？所有未提交内容将被清除。'))return;try{localStorage.removeItem(DRAFTKEY)}catch(e){showToast('无法清理草稿：'+e.message);return}directDraft=null;window.__draftRecoveryError=null;ui.overlay=null;overlay();showToast('草稿已放弃，正式作品不受影响');return}if(action==='directResume'){ui.overlay={type:'directWizard'};overlay();return}if(!d)return;if(action==='directExit'){saveDirectFromDOM();ui.overlay=null;overlay();showToast('创建草稿已保留，可稍后继续');return}if(action==='directPreset'){let preset=DIRECT_PRESETS[d.method];if(!preset)return;d.projectForm.name=preset.name;d.projectForm.genre=preset.genre;d.projectForm.synopsis=preset.synopsis;if(d.method==='blank'){d.inputs.blank.episode='EP01 · 雪夜初见';d.inputs.blank.scene='S01｜外景·霜城王府·雪夜'}else{d.inputs[d.method].text=preset.text;d.inputs[d.method].fileName='';delete d.candidates[d.method]}persistDirect();overlay();showToast('场景素材已填入，可继续生成与校对');return}if(action==='directMethod'){d.method=el.dataset.method;persistDirect();overlay();return}if(['directAddScene','directRemoveScene','directSplitScene','directMergeScene'].includes(action)){saveDirectFromDOM();let c=draftCandidate(),sc=c?.scenes;if(!sc)return;let ix=+el.dataset.index;if(action==='directAddScene')sc.push({heading:'S'+String(sc.length+1).padStart(2,'0')+'｜待命名场景',text:''});if(action==='directRemoveScene'&&sc.length>1)sc.splice(ix,1);if(action==='directSplitScene'){let lines=sc[ix].text.split('\n'),mid=Math.max(1,Math.floor(lines.length/2));sc.splice(ix+1,0,{heading:sc[ix].heading+'（下）',text:lines.splice(mid).join('\n')});sc[ix].text=lines.join('\n')}if(action==='directMergeScene'&&ix>0){sc[ix-1].text+='\n'+sc[ix].text;sc.splice(ix,1)}persistDirect();overlay();return}if(action==='directPane'){let p=el.dataset.pane;document.querySelector('.direct-compare')?.setAttribute('data-pane',p);document.querySelectorAll('[data-action="directPane"]').forEach(b=>b.classList.toggle('active',b.dataset.pane===p));return}if(action==='directBack'){saveDirectFromDOM();d.step=Math.max(0,d.step-1);persistDirect();overlay();return}if(action==='directGenerate'||action==='directRegenerate'){saveDirectFromDOM();let i=d.inputs[d.method];if(!i?.text?.trim()){showToast('请先粘贴原文或选择文件');return}if(d.method==='novel'&&i.strategy==='自定义'&&!i.custom.trim()){showToast('自定义改编要求不能为空');return}if(i.text.includes('[模拟生成失败]')||i.text.includes('[模拟解析失败]')){showToast('Mock 处理失败：请检查输入后重试，草稿已保留');return}let prev=d.candidates[d.method];if(prev&&action==='directRegenerate'&&!confirm('当前校对结果会保留为历史候选，新候选将成为当前编辑版本。是否继续？'))return;if(prev){(d.history||(d.history={}))[d.method]??=[];d.history[d.method].push(structuredClone(prev))}let blocks=scriptBlocks(i.text,d.method),generated=blocks.blocks.map(b=>b.text).join('\n');d.candidates[d.method]={id:id('scriptcandidate'),episodeTitle:'EP01',sceneTitle:blocks.heading,edited:generated,scenes:[{heading:blocks.heading,text:generated}],status:'draft',generatedAt:now(),blocks:blocks.blocks};persistDirect();showToast('正在模拟处理...');setTimeout(()=>{if(ui.overlay?.type==='directWizard'&&d===directDraft){d.step=3;persistDirect();overlay();showToast('Mock '+(d.method==='novel'?'改编':'识别')+'完成，请校对 EP01 草稿')}},450);return}if(action==='directNext'){saveDirectFromDOM();if(d.step===0){let n=d.projectForm.name.trim();if(n.length<1||n.length>60){showToast('作品名称必须为 1–60 个字符');return}}if(d.step===1&&!d.method){showToast('请先选择一种剧本准备方式');return}if(d.step===2){if(d.method==='blank'){if(!d.inputs.blank.episode.trim()||!d.inputs.blank.scene.trim()){showToast('剧集和场次标题不能为空');return}d.step=4}else if(d.candidates[d.method])d.step=3;else{showToast('请先模拟生成或识别剧本');return}}else if(d.step===3){let c=draftCandidate();if(!c?.scenes?.length||c.scenes.some(x=>!x.heading.trim()||!x.text.trim())||!c.episodeTitle.trim()){showToast('请至少保留一个有效场次和剧本内容');return}c.edited=c.scenes.map(x=>x.text).join('\n');c.sceneTitle=c.scenes[0].heading;c.status='confirmed';d.step=4}else d.step++;persistDirect();overlay();return}if(action==='directCommit'){if(d.step!==4)return;let method=d.method,inp=d.inputs[method],candidate=d.candidates[method];if(!d.projectForm.name.trim()||!method||(method!=='blank'&&candidate?.status!=='confirmed')){showToast('创建信息尚未确认');return}let pid=id('p'),did=id('d'),eid=id('e'),srid=id('sr'),mid=id('source');let ok=mutate(store=>{store.projects.unshift({id:pid,name:d.projectForm.name.trim(),genre:d.projectForm.genre,synopsis:d.projectForm.synopsis,sourceType:'direct',origin:'user',cover:d.projectForm.cover||'✦',status:'创作中',createdAt:now(),updatedAt:now(),stage:0,advanced:{model:'默认视频模型',duration:5,shotType:'中景',prompt:'电影感，柔和光影'}});store.dramas.push({id:did,projectId:pid,adaptationId:null});store.episodes.push({id:eid,dramaId:did,title:method==='blank'?inp.episode:candidate.episodeTitle,order:1,status:'剧本草稿'});if(method!=='blank')store.sourceMaterials.push({id:mid,projectId:pid,type:method==='novel'?'novel_text':'script_text',originalText:inp.text,fileName:inp.fileName||'',fileType:inp.fileName?.split('.').pop()||'paste',createdAt:now()});let title=method==='blank'?inp.scene:candidate.sceneTitle,content=method==='blank'?'':candidate.edited;store.scriptRevisions.push({id:srid,episodeId:eid,sourceMaterialId:method==='blank'?null:mid,content,structuredScenes:(method==='blank'?[{heading:title,text:''}]:candidate.scenes).map((sc,i)=>({sceneId:id('scene'),heading:sc.heading,location:'',time:'',order:i+1,blocks:sc.text.split('\n').filter(Boolean).map((t,j)=>({id:id('block'),type:/旁白/.test(t)?'narration':/OS|内心/.test(t)?'os':/^[\p{Script=Han}]{2,6}[:：]/u.test(t)?'dialogue':'action',text:t,order:j+1}))})),status:method==='blank'?'draft':'confirmed',createdAt:now(),confirmedAt:method==='blank'?null:now()});store.preferences.lastProjectId=pid});if(!ok){showToast('保存失败，草稿保留，请重试');return}try{localStorage.removeItem(DRAFTKEY)}catch(e){}directDraft=null;ui.overlay=null;work(pid,0);showToast('直接漫剧创建成功，已进入工作台（Mock）');return}}

function overlay(){if(!db)return;let o=ui.overlay;if(!o){$('overlay').innerHTML='';return}let content='';if(o.type==='directWizard')content=directWizardHTML();else if(o.type==='directResume')content=`<h2>继续创建漫剧？</h2><p class="muted">检测到上次未完成的直接漫剧草稿，可继续编辑，或放弃草稿重新开始。</p><p class="hint">作品：${esc(directDraft?.projectForm?.name||'未命名')} · 上次保存：${esc(fmt(directDraft?.updatedAt))}</p><div class="modalfoot"><button data-action="close">暂不处理</button><button class="danger" data-action="directDiscard">放弃草稿</button><button class="primary" data-action="directResume">继续创建</button></div>`;else if(o.type==='directRecovery')content=`<h2>草稿恢复失败</h2><div class="warn">${esc(window.__draftRecoveryError||'草稿无法读取')}。不会自动清空原始内容。</div><div class="modalfoot"><button data-action="directExportDraft">导出草稿备份</button><button data-action="directDiscard">放弃损坏草稿</button></div>`;else if(o.type==='chooseCreate')content=`<h2>创建新作品</h2><p class="muted">选择适合你的创作入口</p>${[['original','✎ 原创小说','从零开始创作小说'],['import','⇧ 导入小说','上传 / 粘贴并校对章节'],['direct','▣ 直接制作漫剧','小说转剧本、导入剧本或空白创作']].map(x=>`<div class="step" data-action="create" data-type="${x[0]}"><div class="gold" style="font-size:23px">${x[1].slice(0,1)}</div><div><b>${x[1].slice(2)}</b><div class="sub">${x[2]}</div></div><span style="margin-left:auto">→</span></div>`).join('')}`;else if(o.type==='create')content=`<h2>${o.kind==='original'?'创建原创小说':'创建直接漫剧'}</h2><p class="hint">名称必填；未确认前不会生成正式作品。</p><div class="field"><label>作品名称 *</label><input id="newName" maxlength="60" placeholder="请输入 1–60 个字符" value="${esc(o.name||'')}"></div><div class="field"><label>题材</label><select id="newGenre">${['玄幻','奇幻','都市','悬疑','古风','科幻','其他'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>简介（选填）</label><textarea id="newSynopsis" placeholder="一句话介绍你的故事"></textarea></div>${o.kind==='direct'?'<div class="field"><label>初始剧本（可选）</label><textarea id="newScript" placeholder="粘贴已有剧本，或创建空白剧本"></textarea></div>':''}<div class="modalfoot"><button data-action="close">取消</button><button class="primary" data-action="commitCreate" data-kind="${o.kind}">创建并进入工作台</button></div>`;else if(o.type==='import')content=`<h2>导入小说 · 章节校对</h2><div class="sub">P0-1 为交互 Mock，真实 TXT/DOCX 全文解析将在 P0-2 实现</div><div class="stage" style="grid-template-columns:repeat(3,1fr)"><div class="stageitem ${ui.importStep===0?'on':''}">1 导入文本</div><div class="stageitem ${ui.importStep===1?'on':''}">2 校对章节</div><div class="stageitem ${ui.importStep===2?'on':''}">3 确认创建</div></div>${ui.importStep===0?`<div class="field"><label>作品名称 *</label><input id="importName" value="${esc(ui.importName)}" placeholder="请输入作品名称"></div><div class="field"><label>选择 TXT / DOCX 文件（模拟解析）</label><input id="importFile" type="file" accept=".txt,.docx"></div><div class="field"><label>或粘贴小说内容</label><textarea id="importText" rows="5" placeholder="第1章 ...&#10;第2章 ...">${esc(ui.importText)}</textarea></div><div class="hint">上传文件只读取文件名，使用预置章节 Mock，不会解析 DOCX 正文。</div><div class="modalfoot"><button data-action="close">取消</button><button class="primary" data-action="parseImport">模拟识别章节 →</button></div>`:ui.importStep===1?`<div class="row between"><b>识别结果 · ${ui.importChapters.length} 章</b><button class="sm" data-action="addChapter">＋ 添加章节</button></div><div style="max-height:260px;overflow:auto">${ui.importChapters.map((c,i)=>`<div class="listrow"><span class="muted">${i+1}</span><input style="flex:1;min-width:0" data-chapter="${i}" value="${esc(c.title)}"><button class="sm" data-action="splitChapter" data-index="${i}">拆分</button><button class="sm" data-action="mergeChapter" data-index="${i}" ${i===0?'disabled':''}>合并上章</button></div>`).join('')}</div><div class="modalfoot"><button data-action="importBack">上一步</button><button class="primary" data-action="importNext">确认章节 →</button></div>`:`<div class="card"><h3>${esc(ui.importName)}</h3><p class="muted">识别并校对 ${ui.importChapters.length} 个章节</p><p class="hint">创建后将进入简单模式。完整解析、正文编辑在 P0-2。</p></div><div class="modalfoot"><button data-action="importBack">返回校对</button><button class="primary" data-action="commitImport">确认创建</button></div>`}`;else if(o.type==='edit'){let p=pby(o.id);content=`<h2>编辑作品资料</h2><div class="field"><label>名称 *</label><input id="editName" maxlength="60" value="${esc(p.name)}"></div><div class="field"><label>封面符号</label><input id="editCover" maxlength="3" value="${esc(p.cover)}"></div><div class="field"><label>题材</label><input id="editGenre" value="${esc(p.genre)}"></div><div class="field"><label>简介</label><textarea id="editSynopsis">${esc(p.synopsis)}</textarea></div><div class="field"><label>状态</label><select id="editStatus">${statuses.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="hint">创建来源不可修改；保存后首页与创作中心同步。</div><div class="modalfoot"><button data-action="close">取消</button><button class="primary" data-action="commitEdit" data-id="${p.id}">保存修改</button></div>`}else if(o.type==='delete'){let p=pby(o.id),tasks=projectTasks(p),running=tasks.some(t=>t.status==='运行中');let novels=db.novels.filter(n=>n.projectId===p.id),chap=db.chapters.filter(c=>novels.some(n=>n.id===c.novelId)),episodes=db.episodes.filter(e=>db.dramas.some(d=>d.projectId===p.id&&d.id===e.dramaId));content=`<h2>确认删除「${esc(p.name)}」？</h2><div class="warn">直接删除后无法通过归档或回收站恢复。已发布至外部平台的内容不会自动下架。</div><div class="card"><b>受影响的关联数据</b><p class="muted">${chap.length} 个章节 · ${db.adaptations.filter(a=>a.projectId===p.id).length} 个改编任务 · ${episodes.length} 个剧集 · ${db.shots.filter(s=>episodes.some(e=>e.id===s.episodeId)).length} 个镜头 · ${tasks.length} 条生成任务</p></div>${running?'<div class="warn">存在运行中的任务，请先完成或取消任务，暂不可删除。</div>':'<p class="hint">请输入作品名称以确认删除。</p><input id="deleteCheck" placeholder="输入作品名称">'}<div class="modalfoot"><button data-action="close">取消</button><button class="danger" data-action="commitDelete" data-id="${p.id}" ${running?'disabled':''}>确认永久删除</button></div>`}else if(o.type==='panel'){if(o.kind==='tasks')content=`<h2>全局任务面板</h2><p class="hint">运行、失败与待确认任务来自统一数据仓库</p>${db.tasks.map(t=>`<div class="notice"><div class="row between"><span class="tag ${t.status==='失败'?'red':''}">${t.status}</span><span class="sub">${fmt(t.createdAt)}</span></div><b>${esc(t.title)}</b><div class="sub">${esc(pby(t.projectId)?.name||'已删除')}</div><div class="row" style="margin-top:9px"><button class="sm" data-action="detail" data-id="${t.projectId}">查看作品</button>${t.status==='失败'?`<button class="sm" data-action="retryTask" data-id="${t.id}">重试</button>`:t.status==='待确认'?`<button class="sm" data-action="confirmTask" data-id="${t.id}">确认结果</button>`:t.status==='运行中'?`<button class="sm" data-action="cancelTask" data-id="${t.id}">取消任务</button>`:''}</div></div>`).join('')||'<div class="empty">暂无任务</div>'}<div class="modalfoot"><button class="primary" data-action="nav" data-page="tasks">进入任务中心 →</button></div>`;else if(o.kind==='notifications')content=`<h2>消息通知</h2><div class="row between"><span class="hint">已读 ≠ 业务已处理</span><button class="sm" data-action="readAll">全部标记已读</button></div>${db.notifications.map(n=>`<div class="notice ${n.read?'':'unread'}"><b>${esc(n.title)}</b><div class="sub">${n.read?'已读':'未读'} · ${n.handled?'业务已处理':'业务待处理'}</div><div class="row" style="margin-top:9px"><button class="sm" data-action="readNotification" data-id="${n.id}">查看并标记已读</button>${!n.handled?`<button class="sm" data-action="handleNotification" data-id="${n.id}">标记业务已处理</button>`:''}</div></div>`).join('')||'<div class="empty">暂无通知</div>'}`;else content=`<h2>体验用户</h2><p>身份：离线 Demo 体验用户</p><p class="hint">不连接真实账号或在线服务</p><div class="step" data-action="nav" data-page="billing">◉ 订阅账户 →</div><div class="step" data-action="testPanel">⚙ 开发测试工具 →</div><div class="step" data-action="logout">⇥ 模拟退出登录</div>`}else if(o.type==='test')content=`<h2>开发测试工具</h2><p class="hint">仅用于 P0-1 验收，不是正式用户功能。</p><div class="testbar"><b>存储失败模拟</b><p class="hint">开启后保存将失败，编辑表单保持不关闭。</p><button data-action="toggleSaveFailure">${window.__simulateSaveFailure?'关闭模拟失败':'开启模拟失败'}</button></div><div class="testbar"><b>schemaVersion 迁移测试</b><p class="hint">验证旧数据升级与失败保护；不会自动清空。</p><button data-action="testMigration">执行无损迁移自检</button> <button data-action="testMigrationFail">模拟迁移失败</button></div><div class="testbar"><b>重置五部示例</b><p class="hint">仅重置 origin=sample 的作品与关联数据，保留用户作品。</p><button class="danger" data-action="resetPrompt">重置示例数据</button></div><div class="testbar"><b>数据导出</b><p class="hint">导出当前结构化数据 JSON，便于排查。</p><button data-action="export">导出 JSON</button></div>`;else if(o.type==='reset')content=`<h2>重置示例数据？</h2><div class="warn">五部示例作品的修改和任务状态将恢复初始值。你创建的作品及关联数据不会删除。</div><div class="modalfoot"><button data-action="close">取消</button><button class="danger" data-action="resetSamples">确认重置示例</button></div>`;else if(o.type==='newAdapt')content=`<h2>新建改编任务（Mock）</h2><div class="field"><label>改编策略</label><select id="adaptStrategy"><option>忠于原著</option><option>节奏强化</option><option>自定义</option></select></div><p class="hint">此处仅创建独立改编实体与剧集 Mock；完整章节范围、分集规划在 P0-3 实现。</p><div class="modalfoot"><button data-action="close">取消</button><button class="primary" data-action="commitAdapt" data-id="${o.id}">创建改编任务</button></div>`;else if(o.type==='addNovel')content=`<h2>补充小说内容</h2><p class="muted">直接漫剧无需小说。本操作将为当前作品建立空白小说关联（Mock）。</p><div class="modalfoot"><button data-action="close">取消</button><button class="primary" data-action="commitAddNovel" data-id="${o.id}">确认补充</button></div>`;let panel=['edit','panel','test'].includes(o.type);let wide=o.type==='directWizard'&&directDraft?.step===3;$('overlay').innerHTML=`<div class="shade" data-action="close"></div><div class="${panel?'panel':'modal'}" style="${wide?'width:min(1100px,calc(100vw - 24px))':''}">${panel?`<div class="panelhead"><span>${o.type==='edit'?'编辑资料':o.type==='test'?'开发测试工具':'全局面板'}</span><button class="ghost" data-action="close">✕</button></div><div class="panelbody">${content}</div>`:content}</div>`}
function createProject(kind,name,genre,synopsis,script,chapters){let pid=id('p'),nid=id('n'),did=id('d'),aid=id('a'),eid=id('e');let ok=mutate(d=>{d.projects.unshift({id:pid,name,genre,synopsis,sourceType:kind,origin:'user',cover:'✦',status:'创作中',createdAt:now(),updatedAt:now(),stage:0,advanced:{model:'默认视频模型',duration:5,shotType:'中景',prompt:'电影感，柔和光影'}});if(kind!=='direct'){d.novels.push({id:nid,projectId:pid});(chapters||[]).forEach((c,i)=>{let cid=id('c'),rid=id('rev');d.chapters.push({id:cid,novelId:nid,title:c.title,order:i+1,currentRevisionId:rid});d.chapterRevisions.push({id:rid,chapterId:cid,content:c.content||'（P0-1 Mock 内容）',createdAt:now()})})}else{d.adaptations.push({id:aid,projectId:pid,novelId:null,strategy:'直接漫剧',status:'制作中',sourceChapterRevisionIds:[]});d.dramas.push({id:did,projectId:pid,adaptationId:aid});d.episodes.push({id:eid,dramaId:did,title:'EP01',order:1,status:'剧本草稿'});d.scriptRevisions.push({id:id('sr'),episodeId:eid,content:script||'',confirmedAt:null})}d.preferences.lastProjectId=pid});if(ok){ui.overlay=null;if(kind!=='direct'){let novel=db.novels.find(n=>n.projectId===pid),c=db.chapters.find(c=>c.novelId===novel?.id);if(!c){let cid=id('c'),rid=id('rev');if(!mutate(d=>{d.chapters.push({id:cid,novelId:novel.id,title:'第一章 · 新的开始',order:1,currentRevisionId:rid});d.chapterRevisions.push({id:rid,chapterId:cid,content:'',createdAt:now()})}))return;c=db.chapters.find(c=>c.id===cid)}ui.projectId=pid;ui.page='chapter';ui.chapterId=c.id;nvInit(pid).doc='overview';render()}else work(pid,0);showToast('作品创建成功，已进入'+(kind==='direct'?'漫剧制作':'小说写作')+'工作台')}}
function cascade(d,pids){let s=new Set(pids),ns=new Set(d.novels.filter(n=>s.has(n.projectId)).map(n=>n.id)),cs=new Set(d.chapters.filter(c=>ns.has(c.novelId)).map(c=>c.id)),as=new Set(d.adaptations.filter(a=>s.has(a.projectId)).map(a=>a.id)),ds=new Set(d.dramas.filter(x=>s.has(x.projectId)).map(x=>x.id)),es=new Set(d.episodes.filter(e=>ds.has(e.dramaId)).map(e=>e.id)),assets=new Set(d.assets.filter(a=>s.has(a.projectId)).map(a=>a.id)),tasks=new Set(d.tasks.filter(t=>s.has(t.projectId)).map(t=>t.id));d.projects=d.projects.filter(p=>!s.has(p.id));d.novels=d.novels.filter(n=>!ns.has(n.id));d.chapters=d.chapters.filter(c=>!cs.has(c.id));d.chapterRevisions=d.chapterRevisions.filter(r=>!cs.has(r.chapterId));d.adaptations=d.adaptations.filter(a=>!as.has(a.id));d.dramas=d.dramas.filter(x=>!ds.has(x.id));d.episodes=d.episodes.filter(e=>!es.has(e.id));d.scriptRevisions=d.scriptRevisions.filter(r=>!es.has(r.episodeId));d.sourceMaterials=d.sourceMaterials.filter(m=>!s.has(m.projectId));d.assets=d.assets.filter(a=>!assets.has(a.id));d.assetVersions=d.assetVersions.filter(v=>!assets.has(v.assetId));d.shots=d.shots.filter(x=>!es.has(x.episodeId));d.tasks=d.tasks.filter(t=>!tasks.has(t.id));d.candidates=d.candidates.filter(c=>!tasks.has(c.taskId));d.notifications=d.notifications.filter(n=>!s.has(n.projectId));d.snapshots=d.snapshots.filter(n=>!s.has(n.projectId));pids.forEach(pid=>{delete d.preferences.overrides[pid];delete d.preferences.recentLocation[pid]});if(s.has(d.preferences.lastProjectId))d.preferences.lastProjectId=null}
function download(name,text){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function handle(action,el){if(action.startsWith('nv')){nvHandle(action,el);return}let val=el.dataset.val,pid=el.dataset.id;if(action==='nav')nav(el.dataset.page);else if(action==='collapse')mutate(d=>d.preferences.sidebarCollapsed=!d.preferences.sidebarCollapsed);else if(action==='chooseCreate'){ui.overlay={type:'chooseCreate'};overlay()}else if(action==='create'){if(el.dataset.type==='direct'){openDirectWizard();return}ui.overlay={type:el.dataset.type==='import'?'import':'create',kind:el.dataset.type};ui.importStep=0;ui.importChapters=[];ui.importName='';ui.importText='';ui.importFile='';overlay()}else if(action==='close'){if(ui.overlay?.type==='directWizard')saveDirectFromDOM();ui.overlay=null;ui.draft=null;overlay()}else if(action.startsWith('direct')){handleDirect(action,el)}else if(action==='detail')gotoProject(pid);else if(action==='resume')resume(pid);else if(action==='openChapter'){if(ui.page==='chapter'&&ui.chapterId!==pid&&document.getElementById('chapterBody')?.value!==(db.chapterRevisions.find(r=>r.id===db.chapters.find(c=>c.id===ui.chapterId)?.currentRevisionId)?.content||'')){showToast('请先保存当前章节再切换');return}openChapter(pid)}else if(action==='chapterBack'){ui.tab='novel';gotoProject(ui.projectId,'novel')}else if(action==='saveChapter'){let value=document.getElementById('chapterBody')?.value??'';let ok=mutate(d=>{let c=d.chapters.find(c=>c.id===pid);let r=d.chapterRevisions.find(r=>r.id===c.currentRevisionId);if(r)r.content=value;else{let rid=id('rev');d.chapterRevisions.push({id:rid,chapterId:pid,content:value,createdAt:now()});c.currentRevisionId=rid}d.projects.find(p=>p.id===ui.projectId).updatedAt=now()});if(ok)showToast('章节正文已保存')}else if(action==='category'){ui.category=val;render()}else if(action==='view'){ui.view=val;render()}else if(action==='clearFilters'){ui.search='';ui.genre='all';ui.status='all';render()}else if(action==='detailTab'){ui.tab=val;render()}else if(action==='panel'){ui.overlay={type:'panel',kind:el.dataset.type};overlay()}else if(action==='edit'||action==='delete'||action==='newAdapt'||action==='addNovel'){ui.overlay={type:action,id:pid};overlay()}else if(action==='commitCreate'){let name=$('newName').value.trim();if(!name||name.length>60){showToast('作品名称需为 1–60 个字符');return}createProject(el.dataset.kind,name,$('newGenre').value,$('newSynopsis').value.trim(),$('newScript')?.value||'',[])}else if(action==='parseImport'){ui.importName=$('importName').value.trim();ui.importText=$('importText').value;ui.importFile=$('importFile').files[0]?.name||'';if(!ui.importName){showToast('请先填写作品名称');return}if(!ui.importText.trim()&&!ui.importFile){showToast('请上传文件或粘贴内容');return}if(ui.importText.includes('[模拟解析失败]')){showToast('模拟解析失败：文件内容不符合识别规则');return}let parts=ui.importText.trim().split(/(?=第\s*[一二三四五六七八九十百千万0-9]+\s*[章回节])/).filter(x=>x.trim());ui.importChapters=(parts.length>1?parts:ui.importFile?[1,2,3,4].map(i=>'第'+i+'章 · 示例识别内容'):parts).map((s,i)=>({title:s.match(/^第\s*[一二三四五六七八九十百千万0-9]+\s*[章回节][^\n]*/)?.[0]?.trim()||'第'+(i+1)+'章 · 待校对',content:s}));ui.importStep=1;overlay();showToast('章节识别完成（Mock），请校对')}else if(action==='addChapter'){ui.importChapters.push({title:'新增章节',content:''});overlay()}else if(action==='splitChapter'){let i=+el.dataset.index;ui.importChapters.splice(i+1,0,{title:ui.importChapters[i].title+'（下）',content:''});overlay()}else if(action==='mergeChapter'){let i=+el.dataset.index;if(i>0){ui.importChapters[i-1].content+='\n'+ui.importChapters[i].content;ui.importChapters.splice(i,1);overlay()}}else if(action==='importBack'){ui.importStep=Math.max(0,ui.importStep-1);overlay()}else if(action==='importNext'){if(!ui.importChapters.length||ui.importChapters.some(c=>!c.title.trim())){showToast('至少保留一章，且标题不能为空');return}ui.importStep=2;overlay()}else if(action==='commitImport')createProject('import',ui.importName,'其他','导入小说（章节识别 Mock）','',ui.importChapters);else if(action==='commitEdit'){let name=$('editName').value.trim();if(!name){showToast('名称不能为空');return}let changes={name,cover:$('editCover').value.trim()||'✦',genre:$('editGenre').value.trim()||'其他',synopsis:$('editSynopsis').value,status:$('editStatus').value};let ok=mutate(d=>Object.assign(d.projects.find(p=>p.id===pid),changes,{updatedAt:now()}));if(ok){ui.overlay=null;render();showToast('作品资料已保存')}else ui.draft={type:'edit',id:pid,changes}}else if(action==='commitDelete'){let p=pby(pid);if(projectTasks(p).some(t=>t.status==='运行中')){showToast('存在运行中的任务，无法删除');return}if($('deleteCheck')?.value!==p.name){showToast('请输入完整作品名称确认');return}if(mutate(d=>cascade(d,[pid]))){ui.overlay=null;ui.projectId=null;ui.page='center';render();showToast('作品及关联本地数据已删除')}}else if(action==='stage'){ui.workStage=+el.dataset.index;mutate(d=>{d.preferences.recentLocation[ui.projectId]={stage:ui.workStage,at:now()};d.preferences.lastProjectId=ui.projectId;let p=d.projects.find(x=>x.id===ui.projectId);p.stage=ui.workStage})}else if(action==='togglePanel')mutate(d=>d.preferences.panels[el.dataset.side]=!d.preferences.panels[el.dataset.side]);else if(action==='saveAdvanced'){let duration=+$('advDuration').value;if(!Number.isFinite(duration)||duration<1||duration>30){showToast('镜头时长需在 1–30 秒');return}let changes={model:$('advModel').value,duration,shotType:$('advShot').value,prompt:$('advPrompt').value};let ok=mutate(d=>{Object.assign(d.projects.find(p=>p.id===pid).advanced,changes);d.projects.find(p=>p.id===pid).updatedAt=now()});if(ok)showToast('专业参数已保存，简单模式也将沿用');else ui.draft={type:'advanced',id:pid,changes}}else if(action==='simulate'){let tid=id('task');mutate(d=>{d.tasks.unshift({id:tid,projectId:pid,targetType:'stage',targetId:pid+':'+ui.workStage,status:'待确认',title:['剧本准备','角色场景','分镜','视频声音','成片'][ui.workStage]+' · Mock 候选',createdAt:now()});d.candidates.push({id:id('candidate'),taskId:tid,mediaRef:'mock://candidate/'+tid,status:'待确认'});d.notifications.unshift({id:id('notif'),projectId:pid,title:pby(pid).name+'：新候选待确认',read:false,handled:false,createdAt:now()})});showToast('模拟任务完成，候选待确认')}else if(action==='sna
